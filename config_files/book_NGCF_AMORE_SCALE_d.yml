setting:
  data: amazon_book # Dataset
  gpu_id: 1 # GPU_ID
  baseline: NGCF # Base model
  wrapper: AMORE_SCALE # Multi-Objective Method
  epochs: 500 # Number of epochs
  validation_rate: 10 # Period of evaluation during training
  validation_metric: ndcg@20 # Metric of evaluation during training
  batch_size: 2048 # Batch size
hyperparameters:
  dim: [64] # Dimension for embedding
  lr: [0.0005] # Learning rate
  l_2: [0.005] #L2 penalty
  mode: [rd] # Which loss to use
  atk: [{atk_cons: 20, atk_prov: 20}] # Cutoff in metrics approximation
  ranker: [AIMLE] # Which Ranking Approx. to use
  layers: [3]
  message_dropout: [0.1]
  node_dropout: [0.1]
  normalize: [True]
  scale: [0.25, 0.5, 0.75, 0.95]
  item_feature_path: [ 'arrays/amazon_book/NGCF_None_8-backbone=NGCF-mo_method=None-mode=r-data=amazon_book-seed=42-dim=64-lr=0$0005-weight_decay=0$005-layers=3-message_dropout=0$1-node_dropout=0$1-normalize=True-scale1=1.npz' ]




