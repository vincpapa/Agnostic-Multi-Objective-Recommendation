setting:
  data: amazon_book # Dataset
  gpu_id: 3 # GPU_ID
  baseline: BPRMF # Base model
  wrapper: AMORE_SCALE # Multi-Objective Method
  epochs: 500 # Number of epochs
  validation_rate: 10 # Period of evaluation during training
  validation_metric: ndcg@20 # Metric of evaluation during training
  batch_size: 2048 # Batch size
hyperparameters:
  dim: [ 64 ] # Dimension for embedding
  lr: [ 0.0005] # Learning rate
  l_2: [ 0.001 ] #L2 penalty
  mode: [ rmd ] # Which loss to use
  atk: [ { atk_div: 20, atk_nov: 20 } ] # Cutoff when computing approximated metrics
  ranker: [ AIMLE ]
  scale: [ 0.25, 0.5, 0.75, 0.95 ] # [0.25, 0.5, 0.75, 0.9]
  item_feature_path: [ 'arrays/amazon_book/BPRMF_None_9-backbone=BPRMF-mo_method=None-mode=r-data=amazon_book-seed=42-dim=64-lr=0$0005-weight_decay=0$001-scale1=1.npz']




